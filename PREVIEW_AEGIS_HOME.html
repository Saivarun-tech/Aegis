<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEGIS visual preview</title><style>

:root {
  color-scheme: dark;
  --page: #101114;
  --panel: #121416;
  --text: #f5f3ef;
  --muted: #a5a7ae;
  --metal: #d6d0c9;
  --line: #2b2e34;
}

* { box-sizing: border-box; }
html { min-width: 320px; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: inherit; text-decoration: none; }
button, a, summary { -webkit-tap-highlight-color: transparent; }
a:focus-visible, summary:focus-visible {
  outline: 2px solid #d8d0c7;
  outline-offset: 5px;
}

.site-shell {
  min-height: 100svh;
  overflow-x: clip;
  background: linear-gradient(165deg, #0d0f12 0%, #101114 45%, #0c0d10 100%);
}
.skip-link {
  position: fixed;
  top: 8px;
  left: 8px;
  z-index: 100;
  background: #f5f3ef;
  color: #101114;
  padding: 10px 14px;
  border-radius: 8px;
  transform: translateY(-170%);
}
.skip-link:focus { transform: translateY(0); }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Minimal Linear-inspired navigation; no scroll listeners or heavyweight effects. */
.site-header {
  height: 94px;
  position: relative;
  z-index: 10;
  background: #0e1013;
  border-bottom: 1px solid rgba(245, 243, 239, .075);
}
.site-header__inner {
  position: relative;
  height: 100%;
  max-width: 1800px;
  padding-inline: clamp(24px, 5vw, 84px);
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  display: inline-flex;
  align-items: center;
  font-size: clamp(23px, 1.9vw, 30px);
  letter-spacing: .255em;
  font-weight: 750;
  line-height: 1;
  white-space: nowrap;
  color: #f5f3ef;
}
.desktop-nav {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: clamp(38px, 4.2vw, 68px);
  align-items: center;
}
.nav-link {
  position: relative;
  color: #aaa9ad;
  font-size: 16px;
  font-weight: 450;
  padding-block: 15px;
  transition: color 170ms ease;
}
.nav-link:hover, .nav-link--active { color: #f5f3ef; }
.nav-link--active::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 2px;
  width: 24px;
  height: 1.5px;
  background: #f5f3ef;
  transform: translateX(-50%);
}
.contact-button {
  min-height: 52px;
  padding: 0 25px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 500;
  border: 1px solid #77716b;
  border-radius: 12px;
  color: #f5f3ef;
  background: rgba(255, 255, 255, .015);
  transition: background 170ms ease, border-color 170ms ease;
}
.contact-button:hover { background: rgba(255,255,255,.065); border-color: #d6d0c9; }
.mobile-nav { display: none; }

/* Homepage: no visible text in the left column until copy is approved. */
.hero-stage {
  width: min(100%, 1800px);
  margin-inline: auto;
  min-height: calc(100svh - 94px);
  padding: clamp(54px, 8vh, 88px) clamp(24px, 5vw, 84px) clamp(68px, 9vh, 112px);
  display: grid;
  grid-template-columns: minmax(0, .87fr) minmax(0, 1fr);
  align-items: center;
  column-gap: clamp(30px, 4.8vw, 84px);
}
.hero-stage__empty { min-width: 0; }
.system-panel {
  position: relative;
  width: 100%;
  aspect-ratio: 820 / 652;
  min-width: 0;
  max-width: 900px;
  margin: 0;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 53%, #191a1b 0%, #121315 40%, #101114 74%);
  border: 1px solid rgba(222, 215, 208, .25);
  border-radius: clamp(15px, 1.7vw, 26px);
}
.system-panel__art {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* Temporary routes: visible, functional links with no unapproved marketing copy. */
.placeholder-page {
  display: grid;
  place-items: center;
  min-height: calc(100svh - 94px);
  padding: 48px 24px;
  text-align: center;
}
.placeholder-page__eyebrow { color: #98989e; font-size: 12px; letter-spacing: .18em; }
.placeholder-page h1 { font-size: clamp(40px, 7vw, 76px); font-weight: 600; letter-spacing: -.045em; margin: 16px 0; }
.placeholder-page p:last-child { color: var(--muted); font-size: 16px; }

@media (max-width: 1050px) {
  .hero-stage { grid-template-columns: minmax(0, .48fr) minmax(0, 1fr); column-gap: 30px; }
}
@media (max-width: 760px) {
  .site-header { height: 76px; }
  .site-header__inner { padding-inline: 22px; }
  .brand { font-size: 24px; }
  .desktop-nav, .desktop-contact { display: none; }
  .mobile-nav { display: block; position: relative; }
  .mobile-nav summary {
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    list-style: none;
    color: #ebe8e5;
    font-size: 14px;
    font-weight: 550;
    padding: 12px 0 12px 12px;
  }
  .mobile-nav summary::-webkit-details-marker { display: none; }
  .menu-bars { display: flex; flex-direction: column; gap: 4px; }
  .menu-bars span { display: block; height: 1.5px; width: 18px; background: #eeeae7; }
  .mobile-nav__panel {
    position: absolute;
    top: calc(100% + 13px);
    right: -4px;
    min-width: 230px;
    padding: 10px;
    background: #1a1b1f;
    border: 1px solid #3a3b40;
    border-radius: 14px;
    box-shadow: 0 18px 40px rgba(0,0,0,.32);
    display: flex;
    flex-direction: column;
  }
  .mobile-nav__panel a { padding: 13px 14px; border-radius: 8px; color: #d6d0c9; font-size: 15px; }
  .mobile-nav__panel a:hover, .mobile-nav__panel a[aria-current="page"] { background: #27282d; color: #fff; }
  .mobile-nav__panel .mobile-contact { border-top: 1px solid #35363a; border-radius: 0; margin-top: 4px; }
  .hero-stage {
    min-height: calc(100svh - 76px);
    padding: 28px 16px 70px;
    display: block;
  }
  .hero-stage__empty { display: none; }
  .system-panel { max-width: 680px; margin-inline: auto; border-radius: 17px; }
  .placeholder-page { min-height: calc(100svh - 76px); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style></head><body><div class="site-shell"><header class="site-header"><div class="site-header__inner"><a href="#" class="brand">AEGIS</a><nav class="desktop-nav"><a href="#" class="nav-link nav-link--active">Home</a><a href="#" class="nav-link">Technology</a><a href="#" class="nav-link">About</a></nav><a href="#" class="contact-button desktop-contact">Let's connect</a><details class="mobile-nav"><summary><span class="menu-bars"><span></span><span></span><span></span></span><span class="menu-label">Menu</span></summary><nav class="mobile-nav__panel"><a href="#">Home</a><a href="#">Technology</a><a href="#">About</a><a href="#">Let's connect</a></nav></details></div></header><main><section class="hero-stage"><div class="hero-stage__empty"></div><figure class="system-panel"><img class="system-panel__art" src="public/illustrations/aegis-systems.svg" alt="AEGIS system map"></figure></section></main></div></body></html>
